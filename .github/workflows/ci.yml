name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No secrets: with no APOLLO_API_KEY the Apollo client replays fixtures/apollo.json.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/room

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: room
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply schema
        run: npx tsx scripts/migrate.ts

      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p tsconfig.scripts.json

      - name: Tests
        run: npx vitest run
